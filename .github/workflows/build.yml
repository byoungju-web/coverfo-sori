# coverfo 소리 — GitHub 에 올릴 때마다 안드로이드 설치 파일을 자동으로 만들어 Releases 에 올린다.
# v4: 두 가지를 같이 만든다
#   · coverfo-sori.apk        = APK용(full) — coverfo.com/app 의 '앱 받기' 주소가 이 파일 (이름 그대로)
#   · coverfo-sori-store.aab  = 구글 플레이용(store) — Play Console 에 올리는 파일
name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 기본값('tools' 포함)은 새 SDK 에 'tools' 꾸러미가 없어 실패한다(2026-10-21 빌드 #1) → 필요한 것만 지정
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Signing key
        env:
          KS: ${{ secrets.SORI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sori.jks"
            echo "SORI_KEYSTORE=$RUNNER_TEMP/sori.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK + AAB
        env:
          SORI_KS_PASS: ${{ secrets.SORI_KS_PASS }}
        run: gradle assembleFullRelease bundleStoreRelease --no-daemon --stacktrace
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk coverfo-sori.apk
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab coverfo-sori-store.aab
          gh release create "v1.0.${{ github.run_number }}" coverfo-sori.apk coverfo-sori-store.aab --title "coverfo 소리 1.0.${{ github.run_number }}" --notes "자동 빌드 · 폰에는 coverfo-sori.apk 를 눌러 설치 (coverfo-sori-store.aab 는 구글 플레이 등록용)" --latest
