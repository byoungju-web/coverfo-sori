   # coverfo 소리 — GitHub 에 올릴 때마다 안드로이드 설치 파일(APK)을 자동으로 만들어 Releases 에 올린다.
   name: build-apk
   on:
     push:
       branches: [ main ]
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '17'
         - uses: android-actions/setup-android@v3
         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: '8.10.2'
         - name: Signing key
           env:
             KS: ${{ secrets.SORI_KEYSTORE_B64 }}
           run: |
             if [ -n "$KS" ]; then
               echo "$KS" | base64 -d > "$RUNNER_TEMP/sori.jks"
               echo "SORI_KEYSTORE=$RUNNER_TEMP/sori.jks" >> "$GITHUB_ENV"
             fi
         - name: Build APK
           env:
             SORI_KS_PASS: ${{ secrets.SORI_KS_PASS }}
           run: gradle assembleRelease --no-daemon --stacktrace
         - name: Publish to Releases
           env:
             GH_TOKEN: ${{ github.token }}
           run: |
             cp app/build/outputs/apk/release/app-release.apk coverfo-sori.apk
             gh release create "v1.0.${{ github.run_number }}" coverfo-sori.apk --title "coverfo 소리 1.0.${{ github.run_number }}" --notes "자동 빌드 · 폰에서 coverfo-sori.apk 를 눌러 설치" --latest
