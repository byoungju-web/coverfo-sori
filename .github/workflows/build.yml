# pododa 플레이 앱(AAB) 만들기 — 구글 결제(Play Billing) 켜짐
# GitHub → Actions → "플레이 앱 만들기" → Run workflow 로 실행. 결과 파일은 실행 화면 아래 Artifacts 에서 받음
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64   업로드 키 파일(.keystore/.jks)을 글자로 바꾼 것 (keystore-to-base64.html 로 만들기)
#   ANDROID_KEY_ALIAS         키 별칭 (alias)
#   ANDROID_KEYSTORE_PASSWORD 키 저장소 비밀번호
#   ANDROID_KEY_PASSWORD      키 비밀번호 (모르면 위와 같은 값)
name: 플레이 앱 만들기 (구글 결제 포함)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: '버전 코드 — 플레이 콘솔의 예전 앱보다 큰 숫자 (예: 100)'
        required: true
        default: '100'
      version_name:
        description: '버전 이름 (예: 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bubblewrap 설치
        run: npm install -g @bubblewrap/cli

      - name: 설정 준비 (키 · 버전 · 아이콘)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEY_ALIAS KS_PASS; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secret 이 비어 있어요: $v (Settings → Secrets and variables → Actions 확인)"; exit 1; fi
          done
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then echo "::error::버전 코드는 숫자만 적어 주세요"; exit 1; fi
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          mkdir -p build
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > build/upload.keystore
          # 키 별칭이 키 파일 안에 있는지 미리 확인 (틀리면 여기서 알려 줌)
          if ! keytool -list -keystore build/upload.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::키 파일 · 비밀번호 · 별칭(alias) 중 하나가 맞지 않아요. 아래 목록에서 별칭을 확인해 주세요."
            keytool -list -keystore build/upload.keystore -storepass "$KS_PASS" | grep -i 'entry' || true
            exit 1
          fi
          echo "업로드 키 인증서 SHA-1 (플레이 콘솔 '업로드 키 인증서'와 같아야 함):"
          keytool -list -v -keystore build/upload.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA-1:' || true
          # 아이콘: 저장소의 manifest.json 에서 가장 큰 아이콘
          ICON=$(jq -r '[.icons[] | {src, n: (((.sizes // "0x0") | split(" ")[0] | split("x")[0]) | tonumber? // 0)}] | max_by(.n) | .src' manifest.json)
          case "$ICON" in http*) ;; /*) ICON="https://pododa.kr$ICON" ;; *) ICON="https://pododa.kr/$ICON" ;; esac
          echo "아이콘: $ICON"
          jq --argjson vc "$VERSION_CODE" --arg vn "$VERSION_NAME" --arg alias "$KEY_ALIAS" --arg icon "$ICON" \
            '.appVersionCode = $vc | .appVersionName = $vn | .signingKey.alias = $alias | .signingKey.path = "./upload.keystore" | .iconUrl = $icon' \
            android/twa-manifest.json > build/twa-manifest.json
          jq '{packageId, host, appVersionCode, appVersionName, iconUrl, features}' build/twa-manifest.json

      - name: 안드로이드 프로젝트 만들기
        working-directory: build
        run: bubblewrap update --skipVersionUpgrade

      # 구글 플레이 요구: 2026-08-31 부터(연장 시 2026-11-01) 새 앱·업데이트는 대상 API 36(Android 16) 이상
      # Bubblewrap 이 만든 값이 36보다 낮으면 36으로 올림 (이미 36 이상이면 그대로). 바꾸기 전·후 값을 로그에 남김
      - name: 대상 API 수준 36 이상으로 맞추기
        working-directory: build
        run: |
          set -e
          F=app/build.gradle; [ -f "$F" ] || F=app/build.gradle.kts
          echo "바꾸기 전:"; grep -nE "compileSdk|targetSdk" "$F" || true
          perl -pi -e 's/((?:compileSdkVersion|compileSdk|targetSdkVersion|targetSdk)\s*=?\s*)(\d+)/$1.($2<36?36:$2)/ge' "$F"
          echo "바꾼 뒤:"; grep -nE "compileSdk|targetSdk" "$F"
          if ! grep -qE "targetSdk(Version)?\s*=?\s*(3[6-9]|[4-9][0-9])" "$F"; then echo "::error::targetSdk 를 36 이상으로 맞추지 못했어요"; exit 1; fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" > /dev/null

      - name: 앱 파일(AAB) 만들고 업로드 키로 서명
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk

      - name: 키 파일 지우기
        if: always()
        run: rm -f build/upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: pododa-play-${{ github.event.inputs.version_code }}
          path: build/app-release-bundle.aab
          retention-days: 7
          if-no-files-found: error
