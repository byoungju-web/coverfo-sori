# coverfo 문자 시험 앱 (com.coverfo.smstest) — smstest 폴더가 바뀌면 설치 파일을 만들어
# Releases 의 'smstest' 에 coverfo-smstest.apk 로 올린다 (늘 같은 주소, 시험판 표시).
#   받는 주소: https://github.com/byoungju-web/coverfo-sori/releases/download/smstest/coverfo-smstest.apk
# · 소리 앱 빌드(build.yml) · 화면 도우미(helper.yml)와 따로 돈다. 소리 앱의 '최신(latest)' 주소는 바꾸지 않는다 (--prerelease · --latest=false)
# · 서명 키는 소리 앱과 같은 비밀값(SORI_KEYSTORE_B64 · SORI_KS_PASS) — 실제 소리 앱과 같은 조건에서 시험
name: build-smstest
on:
  push:
    branches: [ main ]
    paths:
      - 'smstest/**'
      - '.github/workflows/smstest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smstest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Signing key
        env:
          KS: ${{ secrets.SORI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sori.jks"
            echo "SORI_KEYSTORE=$RUNNER_TEMP/sori.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          SORI_KS_PASS: ${{ secrets.SORI_KS_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publish to Releases (smstest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk coverfo-smstest.apk
          if ! gh release view smstest >/dev/null 2>&1; then
            gh release create smstest --title "coverfo 문자 시험" --notes "문자 보내기 권한이 든 앱이 설치되는지 확인하는 시험 앱. 폰에서 coverfo-smstest.apk 를 눌러 설치" --prerelease --latest=false
          fi
          gh release upload smstest coverfo-smstest.apk --clobber
